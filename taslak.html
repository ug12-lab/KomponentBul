<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>KomponentBul</title>
<style>
    *, *::before, *::after {
        box-sizing: border-box;
    }

    :root {
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-sub: #64748b;
        --text-muted: #475569;
        --border-color: #e2e8f0;
        --table-border: #f1f5f9;
        --th-bg: #f8fafc;
        --row-hover: #f8fafc;
        --cheapest-bg: #ecfdf5;
        --cheapest-border: #10b981;
        --input-bg: #ffffff;
        --incele-bg: #1e293b;
        --incele-text: #ffffff;
        --perakende-bg: #dbeafe;
        --perakende-text: #1d4ed8;
        --toptan-bg: #f3e8ff;
        --toptan-text: #7e22ce;
        --logo-komponent: #0f172a;
        --logo-line: #cbd5e1;
        --logo-com-bg: #e2e8f0;
        --logo-com-text: #475569;
    }

    body.dark-mode {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f1f5f9;
        --text-sub: #94a3b8;
        --text-muted: #cbd5e1;
        --border-color: #334155;
        --table-border: #334155;
        --th-bg: #0f172a;
        --row-hover: #26354d;
        --cheapest-bg: rgba(16, 185, 129, 0.16);
        --cheapest-border: #10b981;
        --input-bg: #1e293b;
        --incele-bg: #3b82f6;
        --incele-text: #ffffff;
        --perakende-bg: rgba(59, 130, 246, 0.22);
        --perakende-text: #93c5fd;
        --toptan-bg: rgba(168, 85, 247, 0.22);
        --toptan-text: #d8b4fe;
        --logo-komponent: #f8fafc;
        --logo-line: #334155;
        --logo-com-bg: rgba(59, 130, 246, 0.2);
        --logo-com-text: #93c5fd;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 36px 24px;
        transition: background-color 0.25s ease, color 0.25s ease;
        overflow-x: hidden;
    }

    /* --- ALENGİRLİ AÇILIŞ (BOOT) EKRANI --- */
    #bootOverlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #bootOverlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    /* 4 Yönden Bacaklı Gerçek İşlemci (QFP CPU) */
    .chip-box {
        position: relative;
        width: 124px;
        height: 124px;
        background: linear-gradient(145deg, #0f172a, #1e293b);
        border: 2px solid #3b82f6;
        border-radius: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 35px rgba(59, 130, 246, 0.45), inset 0 0 20px rgba(16, 185, 129, 0.2);
        margin-bottom: 34px;
        animation: chipPulse 1.8s infinite ease-in-out;
    }

    .chip-pin1-dot {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fbbf24;
        box-shadow: 0 0 6px #fbbf24;
    }

    .chip-pins-left, .chip-pins-right {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .chip-pins-left { left: -13px; }
    .chip-pins-right { right: -13px; }
    .pin-h {
        width: 11px;
        height: 5px;
        background: #60a5fa;
        border-radius: 2px;
        animation: pinSpark 0.9s infinite alternate;
    }

    .chip-pins-top, .chip-pins-bottom {
        position: absolute;
        display: flex;
        flex-direction: row;
        gap: 12px;
    }
    .chip-pins-top { top: -13px; }
    .chip-pins-bottom { bottom: -13px; }
    .pin-v {
        width: 5px;
        height: 11px;
        background: #60a5fa;
        border-radius: 2px;
        animation: pinSpark 0.9s infinite alternate;
    }

    .pin-h:nth-child(1), .pin-v:nth-child(1) { animation-delay: 0.0s; }
    .pin-h:nth-child(2), .pin-v:nth-child(2) { animation-delay: 0.2s; }
    .pin-h:nth-child(3), .pin-v:nth-child(3) { animation-delay: 0.4s; }
    .pin-h:nth-child(4), .pin-v:nth-child(4) { animation-delay: 0.6s; }

    .cpu-die-svg {
        width: 108px;
        height: 108px;
        overflow: visible;
    }
    .cpu-trace-flow {
        stroke-dasharray: 6 6;
        animation: traceFlow 1.2s linear infinite;
    }

        transform-origin: center;
        animation: hexGlow 1.
